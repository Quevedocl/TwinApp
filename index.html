<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4B3FE0">
<title>TwinApp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --fondo:#F3F2F7; --tinta:#1E1B3A; --twin:#4B3FE0; --menta:#BFEBD7; --suave:#6E6A8C; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { font-family:"Bricolage Grotesque",system-ui,sans-serif; background:var(--fondo); color:var(--tinta); }
  :focus-visible { outline:2px solid var(--twin); outline-offset:2px; }
  [hidden] { display:none !important; }
  .marca { font-size:3rem; font-weight:700; letter-spacing:-.03em; }
  .marca span { color:var(--twin); }
  .suave { color:var(--suave); }
  h1 { font-size:1.9rem; letter-spacing:-.02em; }

  /* Login */
  #login { max-width:28rem; min-height:100dvh; margin:0 auto; padding:2.5rem 1.5rem; display:flex; flex-direction:column; justify-content:center; }
  #login form { margin-top:2.5rem; display:grid; gap:.75rem; }
  input { width:100%; font:inherit; font-size:1rem; padding:.85rem 1rem; border:1px solid rgba(30,27,58,.15); border-radius:.85rem; background:#fff; color:var(--tinta); }
  input:focus { border-color:var(--twin); outline:none; }
  .btn { font:inherit; font-weight:600; font-size:1rem; padding:.85rem 1rem; border:0; border-radius:.85rem; background:var(--twin); color:#fff; cursor:pointer; }
  .btn:active { transform:scale(.98); }
  .btn:disabled { opacity:.6; }
  .btn.sec { background:transparent; color:var(--tinta); border:1px solid rgba(30,27,58,.2); font-weight:500; font-size:.9rem; padding:.6rem 1rem; }
  .link { background:none; border:0; font:inherit; font-size:.9rem; color:var(--suave); text-decoration:underline; margin-top:1.5rem; cursor:pointer; align-self:flex-start; }
  #msg { font-size:.9rem; color:#c0392b; }
  #msg.ok { color:var(--twin); }

  /* App */
  #app { max-width:28rem; margin:0 auto; min-height:100dvh; padding-bottom:calc(5rem + env(safe-area-inset-bottom,0px)); }
  .vista { padding:2.5rem 1.5rem 0; }
  .vista p { margin-top:.75rem; }
  .vista .btn { margin-top:2rem; }
  nav { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.95); backdrop-filter:blur(8px); border-top:1px solid rgba(30,27,58,.1); padding-bottom:env(safe-area-inset-bottom,0px); }
  nav ul { list-style:none; padding:0; margin:0 auto; max-width:28rem; display:grid; grid-template-columns:repeat(4,1fr); }
  nav button { width:100%; background:none; border:0; font:inherit; font-size:.75rem; color:var(--suave); padding:.7rem 0; display:flex; flex-direction:column; align-items:center; gap:.25rem; cursor:pointer; }
  nav button svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  nav button[aria-current="page"] { color:var(--twin); font-weight:600; }
  nav button[aria-current="page"] svg { stroke-width:2.4; }
  #toast{position:fixed;left:1rem;right:1rem;bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));max-width:26rem;margin:0 auto;background:var(--tinta);color:#fff;padding:.75rem 1rem;border-radius:.85rem;font-size:.9rem;z-index:20}
  .dos,.grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1.25rem}
  .tile,.card{display:flex;flex-direction:column;gap:.4rem;background:#fff;border-radius:1rem;padding:.6rem;cursor:pointer}
  .card{cursor:default}
  .img{display:grid;place-items:center;aspect-ratio:3/4;background:var(--fondo);border-radius:.7rem;overflow:hidden}
  .img img{width:100%;height:100%;object-fit:contain}
  .img em{color:var(--suave);font-size:.85rem}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:.85rem;padding:.25rem;margin-top:1rem}
  .seg button{border:0;background:none;font:inherit;padding:.55rem;border-radius:.65rem;color:var(--suave);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--twin);color:#fff;font-weight:600}
  #stage{position:relative;aspect-ratio:3/5;margin-top:.75rem;background:#fff;border-radius:1rem;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #stage .base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #stage .vacio{position:absolute;inset:0;display:grid;place-items:center;padding:1.5rem;text-align:center;color:var(--suave)}
  #stage .g{position:absolute;pointer-events:none;-webkit-user-drag:none}
  #stage .g.act{filter:drop-shadow(0 0 3px var(--twin))}
  .ctrl{display:flex;gap:.5rem;align-items:center;margin-top:.75rem}
  .ctrl input[type=range]{flex:1;padding:0;border:0;background:none}
  .tira{display:flex;gap:.5rem;overflow-x:auto;margin-top:.75rem;padding-bottom:.25rem}
  .chip{flex:0 0 4.4rem;border:2px solid transparent;border-radius:.8rem;background:#fff;padding:.2rem;cursor:pointer;font:inherit}
  .chip.on{border-color:var(--twin)}
  .chip img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
  .chip small{display:block;font-size:.65rem;color:var(--suave);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .lista{list-style:none;padding:0;margin-top:1.25rem;display:grid;gap:.6rem}
  .lista li{background:#fff;border-radius:1rem;padding:.8rem 1rem;display:flex;gap:.5rem;align-items:center}
  .lista b{flex:1}
  #fg{display:grid;gap:.75rem;margin-top:1.25rem;background:#fff;border-radius:1rem;padding:1rem}
  #fg label{display:grid;gap:.3rem;font-size:.85rem;color:var(--suave)}
  select{font:inherit;padding:.85rem 1rem;border:1px solid rgba(30,27,58,.15);border-radius:.85rem;background:#fff}
  .vista .ctrl .btn,.vista .card .btn,.vista .lista .btn,.vista #fg .btn,.vista .arriba{margin-top:0}
  .ctrl .btn,.card .btn,.lista .btn{padding:.5rem .8rem;font-size:.85rem}
  .ctrl{flex-wrap:wrap}
  .tile label{display:flex;flex-direction:column;gap:.4rem;cursor:pointer}
  .tile .btn{margin-top:.25rem;padding:.5rem .8rem;font-size:.85rem}
  .hf{margin-top:1.5rem;display:grid;gap:.5rem}
</style>
</head>
<body>

<main id="login" hidden>
  <div class="marca">Twin<span>App</span></div>
  <p class="suave" style="margin-top:.75rem">Pruébate tu ropa en tu gemelo digital.</p>
  <form id="form">
    <input id="username" placeholder="Nombre de usuario" autocomplete="nickname" hidden>
    <input id="email" type="email" placeholder="Correo" autocomplete="email" required>
    <input id="password" type="password" placeholder="Contraseña (mínimo 6 caracteres)" minlength="6" autocomplete="current-password" required>
    <p id="msg" role="alert"></p>
    <button class="btn" id="enviar">Entrar</button>
  </form>
  <button class="link" id="alternar" type="button">No tengo cuenta, crear una</button>
</main>

<div id="app" hidden>
  <section class="vista" id="v-probador" hidden></section>
  <section class="vista" id="v-armario" hidden></section>
  <section class="vista" id="v-outfits" hidden></section>
  <section class="vista" id="v-yo" hidden></section>
  <div id="toast" role="status" hidden></div>

  <nav aria-label="Principal">
    <ul>
      <li><button data-v="probador"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>Probador</button></li>
      <li><button data-v="armario"><svg viewBox="0 0 24 24"><path d="M9 3l-6 4 2.5 3.5L8 9v12h8V9l2.5 1.5L21 7l-6-4a3 3 0 0 1-6 0z"/></svg>Armario</button></li>
      <li><button data-v="outfits"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Outfits</button></li>
      <li><button data-v="yo"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Yo</button></li>
    </ul>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
  // La clave "publishable" está pensada para ir en el navegador;
  // la seguridad real la dan las reglas por usuario (RLS) de la base de datos.
  const SUPABASE_URL = "https://xblsqxgagysufgaxydki.supabase.co";
  const SUPABASE_KEY = "sb_publishable_CuKlpfRSWOtHamxpCp9RYg_Vsznq-7C";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const IMGLY = "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";
  const GRADIO = "https://cdn.jsdelivr.net/npm/@gradio/client@1/+esm";
  // Modelo de prueba virtual (Space gratuito de Hugging Face). Si algún día cambia, se edita aquí.
  const HF_SPACE = "zhengchong/CatVTON", HF_ENDPOINT = "/submit_function";

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const CAT = { superior: "Superior", inferior: "Inferior", enterito: "Enterito", abrigo: "Abrigo", calzado: "Calzado" };
  const PROBABLES = ["superior", "inferior", "enterito", "abrigo"];
  const ORDEN = ["inferior", "enterito", "superior", "abrigo"];            // de abajo hacia arriba
  const TIPO = { inferior: "lower", enterito: "overall", superior: "upper", abrigo: "upper" };
  const S = { user: null, profile: {}, garments: [], outfits: [], gu: {}, au: {}, ou: {}, sel: [], res: {}, side: "front", form: false, para: null, busy: false };
  const uid = () => S.user.id;
  const garm = (id) => S.garments.find((g) => g.id === id);

  function aviso(t, ms = 3000) {
    const el = $("toast"); el.textContent = t; el.hidden = false;
    clearTimeout(aviso.t); if (ms) aviso.t = setTimeout(() => (el.hidden = true), ms);
  }

  // ---- Imágenes ----
  const aBlob = (c, tipo = "image/png", q) => new Promise((r) => c.toBlob(r, tipo, q));
  async function lienzo(src, maxH, blanco) {
    const bmp = await createImageBitmap(src, { imageOrientation: "from-image" });
    const k = Math.min(1, maxH / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const ctx = c.getContext("2d");
    if (blanco) { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); }
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    return c;
  }
  const comoJpeg = async (src, maxH = 1024) => aBlob(await lienzo(src, maxH, true), "image/jpeg", 0.92);
  async function recortar(blob) {
    const c = await lienzo(blob, 4096), ctx = c.getContext("2d");
    const d = ctx.getImageData(0, 0, c.width, c.height).data;
    let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++)
      if (d[(y * c.width + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 <= x0 || y1 <= y0) return blob;
    const o = document.createElement("canvas"); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
    o.getContext("2d").drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
    return aBlob(o);
  }
  // Prenda: quita el fondo en el teléfono y recorta (solo para el armario)
  async function prepararPrenda(file) {
    const peq = await aBlob(await lienzo(file, 1024));
    try {
      const { removeBackground } = await import(IMGLY);
      return recortar(await removeBackground(peq, { model: "isnet_quint8", output: { format: "image/png" } }));
    } catch (e) { console.error(e); throw new Error("No se pudo quitar el fondo de la prenda. Revisa tu conexión e inténtalo de nuevo."); }
  }
  // Traje gris genérico (silueta plana sobre fondo blanco) que se usa para "vaciar" la ropa original
  async function trajeGris() {
    const c = document.createElement("canvas"); c.width = 768; c.height = 1024;
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, 768, 1024);
    const m = [[330,110],[210,150],[120,330],[210,375],[262,300],[272,520],[255,620],[240,960],[365,960],[384,640]];
    x.beginPath(); m.forEach(([a, b], i) => (i ? x.lineTo(a, b) : x.moveTo(a, b)));
    [...m].reverse().forEach(([a, b]) => x.lineTo(768 - a, b));
    x.quadraticCurveTo(384, 230, 330, 110); x.closePath();
    x.fillStyle = "#8b9099"; x.fill(); x.lineWidth = 4; x.strokeStyle = "#6c7079"; x.stroke();
    return aBlob(c, "image/jpeg", 0.95);
  }

  // ---- Prueba virtual con IA (Hugging Face, gratis) ----
  let hf = null, hfTok = null, capaVacia = null;
  async function vestir(persona, prenda, tipo) {
    const token = localStorage.getItem("hf_token") || undefined;
    const { Client, handle_file } = await import(GRADIO);
    if (!hf || hfTok !== token) { hf = await Client.connect(HF_SPACE, token ? { hf_token: token } : {}); hfTok = token; }
    if (!capaVacia) { const c = document.createElement("canvas"); c.width = c.height = 8; capaVacia = await aBlob(c); }
    const r = await hf.predict(HF_ENDPOINT, {
      person_image: { background: handle_file(persona), layers: [handle_file(capaVacia)], composite: null },
      cloth_image: handle_file(prenda), cloth_type: tipo,
      num_inference_steps: 30, guidance_scale: 2.5, seed: 42, show_type: "result only",
    });
    const f = r.data?.[0]; const url = f?.url || f?.path || f;
    if (!url || typeof url !== "string") throw new Error("El modelo no devolvió una imagen.");
    const resp = await fetch(url); if (!resp.ok) throw new Error("No se pudo descargar la imagen generada.");
    return resp.blob();
  }
  const errIA = (e) => {
    const t = String(e?.message || e || "");
    return /quota|GPU|limit/i.test(t) ? "Se acabó tu cupo gratuito de GPU por ahora. Añade tu token de Hugging Face en Yo o espera un rato."
      : "No se pudo generar la imagen (" + t.slice(0, 120) + "). Reintenta en un momento.";
  };

  // ---- Supabase ----
  async function subir(bucket, path, blob) {
    const { error } = await sb.storage.from(bucket).upload(path, blob, { contentType: blob.type || "image/png", upsert: true });
    if (error) throw error;
  }
  async function firmar(bucket, paths) {
    paths = paths.filter(Boolean); if (!paths.length) return {};
    const { data } = await sb.storage.from(bucket).createSignedUrls(paths, 3600);
    return Object.fromEntries((data || []).map((d) => [d.path, d.signedUrl]));
  }
  async function cargar() {
    const [p, g, o] = await Promise.all([
      sb.from("profiles").select("*").eq("id", uid()).maybeSingle(),
      sb.from("garments").select("*").order("created_at", { ascending: false }),
      sb.from("outfits").select("*").order("created_at", { ascending: false }),
    ]);
    S.profile = p.data || {}; S.garments = g.data || []; S.outfits = o.data || [];
    S.sel = S.sel.filter((id) => garm(id));
    const pr = S.profile;
    const [gu, au, ou] = await Promise.all([
      firmar("garments", S.garments.flatMap((x) => [x.front_path, x.back_path])),
      firmar("avatars", [pr.avatar_front_path, pr.avatar_back_path, pr.base_front_path, pr.base_back_path]),
      firmar("avatars", S.outfits.map((x) => x.preview_path)),
    ]);
    S.gu = gu; S.au = au; S.ou = ou; pintar();
  }

  // ---- Vistas ----
  const baseUrl = (lado) => S.au[S.profile["base_" + lado + "_path"]] || S.au[S.profile["avatar_" + lado + "_path"]];
  function pYo() {
    const tile = (l, t) => { const u = baseUrl(l), tiene = !!S.profile["avatar_" + l + "_path"], traje = !!S.profile["base_" + l + "_path"];
      return `<div class="tile"><label><span class="img">${u ? `<img src="${u}" alt="Foto de ${t.toLowerCase()}">` : "<em>Sin foto</em>"}</span><b>${t}</b><small class="suave">${tiene ? "Toca para cambiarla" : "Toca para subirla"}</small><input type="file" accept="image/*" data-av="${l}" hidden></label>${tiene && !traje ? `<button class="btn sec" data-act="traje" data-l="${l}">Poner traje gris</button>` : ""}</div>`; };
    $("v-yo").innerHTML = `<h1>Yo</h1><p class="suave">${esc(S.profile.username)}</p>
      <p class="suave">Sube una foto de cuerpo completo de frente y otra de espalda: de pie, brazos algo separados, buena luz. La IA te quita la ropa que llevas y te deja un traje gris (conserva cara y manos).</p>
      <div class="dos">${tile("front", "Frente")}${tile("back", "Espalda")}</div>
      <div class="hf"><b>Token de Hugging Face (opcional)</b>
        <p class="suave" style="font-size:.85rem">Da más cupo gratuito de GPU. Créalo gratis en huggingface.co/settings/tokens (tipo Read) y pégalo aquí; se guarda solo en este teléfono.</p>
        <input id="hftok" type="password" placeholder="hf_..." value="${esc(localStorage.getItem("hf_token") || "")}" autocomplete="off"></div>
      <button class="btn sec" data-act="salir">Cerrar sesión</button>`;
  }
  function pArmario() {
    const form = S.form ? `<form id="fg"><input name="n" placeholder="Nombre (ej. Polera negra oversize)" required>
      <select name="c" aria-label="Categoría">${PROBABLES.map((k) => `<option value="${k}">${CAT[k]}</option>`).join("")}</select>
      <label>Foto de frente (la prenda sola, sobre una superficie lisa)<input type="file" name="f" accept="image/*" required></label>
      <label>Foto de espalda (opcional)<input type="file" name="b" accept="image/*"></label>
      <button class="btn" id="gbtn">Guardar prenda</button><button class="btn sec" type="button" data-act="cancelarG">Cancelar</button></form>`
      : `<button class="btn" data-act="nuevaG">Añadir prenda</button>`;
    const cards = S.garments.map((g) => `<div class="card"><span class="img"><img src="${S.gu[g.front_path] || ""}" alt=""></span><b>${esc(g.name)}</b><small class="suave">${CAT[g.category]}${g.back_path ? "" : " · sin espalda"}</small><button class="btn sec" data-act="borrarG" data-id="${g.id}">Borrar</button></div>`).join("");
    $("v-armario").innerHTML = `<h1>Armario</h1>${S.garments.length || S.form ? "" : '<p class="suave">Aún no tienes prendas. Añade la primera para empezar.</p>'}${form}<div class="grid">${cards}</div>`;
  }
  function pProbador() {
    const r = S.res[S.side], img = r?.url || baseUrl(S.side);
    const chips = S.garments.filter((g) => PROBABLES.includes(g.category)).map((g) => `<button class="chip${S.sel.includes(g.id) ? " on" : ""}" data-act="usar" data-id="${g.id}"><img src="${S.gu[g.front_path] || ""}" alt=""><small>${esc(g.name)}</small></button>`).join("");
    $("v-probador").innerHTML = `<h1>Probador</h1>
      <div class="seg"><button data-act="lado" data-side="front" aria-pressed="${S.side === "front"}">Frente</button><button data-act="lado" data-side="back" aria-pressed="${S.side === "back"}">Espalda</button></div>
      <div id="stage">${img ? `<img class="base" src="${img}" alt="Tu gemelo">` : `<div class="vacio">Sube tu foto de ${S.side === "front" ? "frente" : "espalda"} en la pestaña Yo.</div>`}</div>
      <div class="ctrl"><button class="btn" data-act="vestir" ${S.sel.length && img ? "" : "disabled"}>Vestir</button>
        <button class="btn sec" data-act="limpiar" ${S.sel.length ? "" : "disabled"}>Quitar todo</button>
        <button class="btn sec" data-act="guardar" ${r?.blob ? "" : "disabled"}>Guardar outfit</button></div>
      <p class="suave" style="font-size:.85rem">Elige prendas (una por categoría) y pulsa Vestir. Cada prenda tarda entre 1 y 2 minutos en el servidor gratuito.</p>
      <div class="tira">${chips || '<span class="suave">Añade prendas en el Armario.</span>'}</div>`;
  }
  function pOutfits() {
    $("v-outfits").innerHTML = `<h1>Outfits</h1>` + (S.outfits.length
      ? `<div class="grid">${S.outfits.map((o) => `<div class="card"><span class="img"><img src="${S.ou[o.preview_path] || ""}" alt=""></span><b>${esc(o.name)}</b><button class="btn" data-act="probarO" data-id="${o.id}">Usar</button><button class="btn sec" data-act="borrarO" data-id="${o.id}">Borrar</button></div>`).join("")}</div>`
      : '<p class="suave">Cuando guardes una combinación desde el Probador, aparecerá aquí.</p>');
  }
  const pintar = () => { pYo(); pArmario(); pProbador(); pOutfits(); };

  // ---- Acciones ----
  async function ocupado(fn) {
    if (S.busy) return aviso("Espera a que termine el proceso actual.");
    S.busy = true; try { await fn(); } finally { S.busy = false; }
  }
  async function ponerTraje(lado, foto) {
    aviso("Vistiéndote con el traje gris… puede tardar 1–2 min la primera vez.", 0);
    try {
      const out = await vestir(foto, await trajeGris(), "overall");
      const campo = "base_" + lado + "_path", viejo = S.profile[campo], path = `${uid()}/${lado}-traje-${Date.now()}.jpg`;
      await subir("avatars", path, out);
      const { error } = await sb.from("profiles").update({ [campo]: path }).eq("id", uid()); if (error) throw error;
      if (viejo) sb.storage.from("avatars").remove([viejo]);
      S.res[lado] = null; await cargar(); aviso("Listo: ya tienes tu gemelo con traje gris.");
    } catch (e) { console.error(e); await cargar(); aviso("Tu foto se guardó, pero " + errIA(e), 8000); }
  }
  async function subirAvatar(lado, file) {
    await ocupado(async () => {
      aviso("Guardando tu foto…", 0); let foto;
      try {
        foto = await comoJpeg(file);
        const campo = "avatar_" + lado + "_path", cb = "base_" + lado + "_path", path = `${uid()}/${lado}-${Date.now()}.jpg`;
        const viejos = [S.profile[campo], S.profile[cb]].filter(Boolean);
        await subir("avatars", path, foto);
        const { error } = await sb.from("profiles").update({ [campo]: path, [cb]: null }).eq("id", uid()); if (error) throw error;
        if (viejos.length) sb.storage.from("avatars").remove(viejos);
        S.res[lado] = null; await cargar();
      } catch (e) { return aviso(e.message || "No se pudo guardar la foto.", 6000); }
      await ponerTraje(lado, foto);
    });
  }
  async function guardarPrenda(f) {
    await ocupado(async () => {
      const fd = new FormData(f), back = fd.get("b"); $("gbtn").disabled = true;
      aviso("Procesando fotos de la prenda…", 0);
      try {
        const id = crypto.randomUUID(), fp = `${uid()}/${id}-front.png`; let bp = null;
        await subir("garments", fp, await prepararPrenda(fd.get("f")));
        if (back && back.size) { bp = `${uid()}/${id}-back.png`; await subir("garments", bp, await prepararPrenda(back)); }
        const { error } = await sb.from("garments").insert({ id, name: fd.get("n").trim(), category: fd.get("c"), front_path: fp, back_path: bp });
        if (error) throw error;
        S.form = false; await cargar(); aviso("Prenda guardada.");
      } catch (e) { $("gbtn") && ($("gbtn").disabled = false); aviso(e.message || "No se pudo guardar la prenda.", 6000); }
    });
  }
  async function vestirSel() {
    const lado = S.side, gs = ORDEN.map((c) => S.sel.map(garm).find((g) => g.category === c)).filter(Boolean);
    if (!gs.length) return;
    const ruta = (g) => (lado === "back" ? g.back_path : g.front_path), falta = gs.find((g) => !ruta(g));
    if (falta) return aviso(`"${falta.name}" no tiene foto de espalda.`, 5000);
    try {
      let persona = await comoJpeg(await (await fetch(baseUrl(lado))).blob());
      for (let i = 0; i < gs.length; i++) {
        aviso(`Vistiendo ${i + 1} de ${gs.length}: ${gs[i].name}… (1–2 min)`, 0);
        const prenda = await comoJpeg(await (await fetch(S.gu[ruta(gs[i])])).blob());
        persona = await vestir(persona, prenda, TIPO[gs[i].category]);
      }
      S.res[lado] = { blob: persona, url: URL.createObjectURL(persona) }; pProbador(); aviso("Listo.");
    } catch (e) { console.error(e); aviso(errIA(e), 8000); }
  }
  const acts = {
    salir: () => sb.auth.signOut(),
    nuevaG: () => { S.form = true; pArmario(); },
    cancelarG: () => { S.form = false; pArmario(); },
    lado: (b) => { S.side = b.dataset.side; pProbador(); },
    usar: (b) => {
      const g = garm(b.dataset.id);
      S.sel = S.sel.includes(g.id) ? S.sel.filter((x) => x !== g.id) : [...S.sel.filter((x) => garm(x).category !== g.category), g.id];
      S.res = {}; pProbador();
    },
    limpiar: () => { S.sel = []; S.res = {}; pProbador(); },
    vestir: () => ocupado(vestirSel),
    traje: (b) => ocupado(async () => {
      const l = b.dataset.l;
      try { const blob = await (await fetch(S.au[S.profile["avatar_" + l + "_path"]])).blob(); await ponerTraje(l, await comoJpeg(blob)); }
      catch (e) { aviso(errIA(e), 6000); }
    }),
    guardar: async () => {
      const r = S.res[S.side]; if (!r?.blob) return;
      const name = prompt("Nombre del outfit"); if (!name || !name.trim()) return;
      aviso("Guardando outfit…", 0);
      try {
        const path = `${uid()}/outfit-${Date.now()}-${S.side}.jpg`; await subir("avatars", path, r.blob);
        const { error } = await sb.from("outfits").insert({ name: name.trim(), items: S.sel.map((id) => ({ garment_id: id, side: S.side })), preview_path: path });
        if (error) throw error;
        await cargar(); aviso("Outfit guardado.");
      } catch (e) { aviso("No se pudo guardar el outfit.", 4000); }
    },
    borrarG: async (b) => {
      const g = garm(b.dataset.id); if (!g || !confirm(`¿Borrar "${g.name}"?`)) return;
      await sb.storage.from("garments").remove([g.front_path, g.back_path].filter(Boolean));
      const { error } = await sb.from("garments").delete().eq("id", g.id);
      if (error) return aviso("No se pudo borrar.", 4000);
      await cargar();
    },
    borrarO: async (b) => {
      const o = S.outfits.find((x) => x.id === b.dataset.id); if (!o || !confirm("¿Borrar este outfit?")) return;
      if (o.preview_path) await sb.storage.from("avatars").remove([o.preview_path]);
      await sb.from("outfits").delete().eq("id", o.id); await cargar();
    },
    probarO: (b) => {
      const o = S.outfits.find((x) => x.id === b.dataset.id); if (!o) return;
      const lado = o.items?.[0]?.side || "front";
      S.sel = (o.items || []).map((i) => i.garment_id).filter((id) => garm(id));
      S.side = lado; S.res = { [lado]: { url: S.ou[o.preview_path] } }; pProbador(); ir("probador");
    },
  };
  document.addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (b) acts[b.dataset.act]?.(b); });
  document.addEventListener("change", (e) => { const t = e.target; if (t.dataset?.av && t.files[0]) subirAvatar(t.dataset.av, t.files[0]); });
  document.addEventListener("input", (e) => {
    if (e.target.id === "hftok") { const v = e.target.value.trim(); v ? localStorage.setItem("hf_token", v) : localStorage.removeItem("hf_token"); }
  });
  document.addEventListener("submit", (e) => { if (e.target.id === "fg") { e.preventDefault(); guardarPrenda(e.target); } });

  // ---- Navegación ----
  function ir(v) {
    document.querySelectorAll(".vista").forEach((s) => (s.hidden = s.id !== "v-" + v));
    document.querySelectorAll("nav button").forEach((b) =>
      b.dataset.v === v ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
    history.replaceState(null, "", "#" + v);
  }
  document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => ir(b.dataset.v)));
  function mostrar(sesion) {
    $("login").hidden = !!sesion; $("app").hidden = !sesion; S.user = sesion?.user || null;
    if (sesion) { ir(location.hash.slice(1) || "probador"); if (S.para !== S.user.id) { S.para = S.user.id; setTimeout(cargar, 0); } }
    else { S.para = null; S.sel = []; S.res = {}; }
  }

  // ---- Login / registro ----
  let modo = "entrar";
  $("alternar").addEventListener("click", () => {
    modo = modo === "entrar" ? "crear" : "entrar";
    $("username").hidden = modo === "entrar"; $("username").required = modo === "crear";
    $("password").autocomplete = modo === "entrar" ? "current-password" : "new-password";
    $("enviar").textContent = modo === "entrar" ? "Entrar" : "Crear cuenta";
    $("alternar").textContent = modo === "entrar" ? "No tengo cuenta, crear una" : "Ya tengo cuenta, entrar";
    $("msg").textContent = "";
  });
  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("msg"), btn = $("enviar"); msg.className = ""; msg.textContent = ""; btn.disabled = true;
    const email = $("email").value.trim(), password = $("password").value;
    if (modo === "entrar") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) msg.textContent = "Correo o contraseña incorrectos.";
    } else {
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username: $("username").value.trim() } } });
      if (error) msg.textContent = error.message;
      else if (!data.session) { msg.className = "ok"; msg.textContent = "Cuenta creada. Revisa tu correo para confirmarla y luego entra."; }
    }
    btn.disabled = false;
  });
  sb.auth.onAuthStateChange((_evento, sesion) => mostrar(sesion));
  sb.auth.getSession().then(({ data }) => mostrar(data.session));
</script>
</body>
</html>
